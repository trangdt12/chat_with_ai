services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cwd
      POSTGRES_PASSWORD: cwd
      POSTGRES_DB: cwd
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cwd -d cwd"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    # Chỉ 1 tiến trình: nút Dừng (T-10) dùng registry trong bộ nhớ.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --workers 1
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data/files:/data/files
      - ./models:/models
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    command: python -m app.ingestion.worker
    env_file: .env
    volumes:
      - ./backend:/app
      - ./data/files:/data/files
      - ./models:/models
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:20-alpine
    working_dir: /web
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_TARGET: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./web:/web
      - web_node_modules:/web/node_modules
    depends_on:
      - api

volumes:
  pgdata:
  web_node_modules:

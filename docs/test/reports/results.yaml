# Kết quả chạy TC lớp E bằng agent-browser — file máy đọc được, agent cập nhật trong lúc chạy.
# Định nghĩa PASS/FAIL nằm ở ../test-cases.yaml; file này chỉ ghi kết quả, không chép lại hay sửa `expect`.
#
# Quy tắc:
#   - Mỗi lần chạy thêm 1 phần tử vào `rounds`; không sửa vòng đã `done`.
#   - run.verdict: PASS ⇔ mọi expect ok: true; FAIL ⇔ có expect ok: false; BLOCKED ⇔ không chấm được.
#   - tc.verdict: PASS ⇔ 3/3 run PASS; có run FAIL ⇒ FAIL; còn lại ⇒ BLOCKED.
#   - expect[].line chép nguyên văn từ test-cases.yaml (cùng thứ tự); evidence là đường dẫn tương đối
#     từ docs/test/reports/, có thể kèm #L<dòng>.
#   - Dừng giữa chừng (môi trường chết / kết quả mơ hồ / AC mâu thuẫn): status: stopped, điền stopped_reason
#     và questions, rồi hỏi người.
#
# Mẫu một vòng:
#
# - id: 2026-11-02-ab1
#   method: agent-browser
#   date: 2026-11-02
#   commit: 20031fe

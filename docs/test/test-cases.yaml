# Định nghĩa PASS/FAIL máy đọc được cho từng test case — TP-CWD-001 (TEST_PLAN.md).
# TC-001..035: đường xương sống US-001 + US-009 (02-test-plan.md). TC-036..102, PERF-001..005: chu kỳ 2–3.
# Viết TRƯỚC khi chạy. Không sửa khối `expect` sau khi đã thấy kết quả; muốn đổi thì tăng `version`
# của TC và ghi lý do vào `changelog`.
#
# Quy tắc verdict (áp dụng cho mọi TC):
#   PASS    ⇔ lệnh `run` kết thúc với exit code 0 VÀ `verdict` đúng VÀ mọi dòng `expect` được hiện thực
#             thành assert trong mã test (review đối chiếu trước lần chạy đầu).
#   FAIL    ⇔ bất kỳ dòng `expect` nào sai.
#   BLOCKED ⇔ không đánh giá được (skip, timeout hạ tầng, thiếu dữ liệu, test chưa viết). BLOCKED KHÔNG phải PASS.
#   Lớp E: PASS chỉ khi PASS 3/3 lần chạy liên tiếp.
#
# Trường:
#   ac       danh sách AC
#   req      danh sách NFR / E / G / DoD (TC-036+). Bắt buộc: ac hoặc req có ≥ 1 phần tử; không có thì không được ở file này
#   layer    U | I | E | Q | P | S, hoặc danh sách khi một TC gom nhiều lớp (xem TEST_PLAN.md §6.1)
#   profile  FAKE | REAL | none
#   status   existing                → test đã có, assert đã khớp `expect`
#            existing-unreviewed     → test đã có nhưng CHƯA đối chiếu assert với `expect`; phải review (EN-4)
#                                      rồi đổi thành existing hoặc existing-needs-assert trước lần chạy đầu
#            existing-needs-assert   → test đã có, phải thêm assert ghi trong `gap`
#            to-write                → test chưa có; `target` là tên dự kiến
#            manual                  → người chấm điền file kết quả; máy đọc file đó
#            blocked                 → chưa viết/chạy được; lý do ở `blocked_by` (ID câu hỏi mở / việc TK)
#            deferred                → tính năng không có trong test item; xem NT-xx ở TEST_PLAN.md §5
#   target, run  có thể là danh sách; PASS cần mọi lệnh exit code 0
#   expect   các mệnh đề phải đúng; ký hiệu: r = response, ev = danh sách sự kiện SSE,
#            done = payload answer.completed, doc = dòng documents, DB = DB cwd_test (lớp I) hoặc cwd (lớp E/Q/P)

version: 2
written: 2026-10-28
updated: 2026-11-02
commit_under_test: 20031fe
changelog:
  - "v2 (2026-11-02): thêm TC-036..102 và PERF-001..005 theo TEST_PLAN.md Phụ lục A; thêm trường req, status existing-unreviewed/blocked/deferred. TC-001..035 không đổi."

profiles:
  FAKE: {LLM_FAKE: 1, EMBED_FAKE: 1, RETRIEVAL_NOT_FOUND_TAU: 0.25}
  REAL: {LLM_FAKE: 0, EMBED_FAKE: 0, RETRIEVAL_NOT_FOUND_TAU: 0.35, LLM_MODEL: claude-opus-5-5}

helpers:
  norm: "app.ingestion.chunker.normalize_page(s) → gộp mọi khoảng trắng thành 1 dấu cách → strip → lower()"
  page_text: "pypdf.PdfReader(doc.file_path).pages[page-1].extract_text()"

